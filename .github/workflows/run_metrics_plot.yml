name: Run tsoppy QC metrics plots

on:
  push:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run unit tests
        run: uv run pytest tests/ -v

      - name: Setup LocalApp variables
        run: |
          RUN_ID=251211_NB552811_0117_AHTJM2BGYX

          echo "RUN_ID=${RUN_ID}" >> $GITHUB_ENV


      - name: Run plot_QC_metrics.py 1R LocalApp
        run: |
          RESULTS_DIR=results_python/${RUN_ID}/1R
          mkdir -p ${RESULTS_DIR}
          RESULTS_FILE=${RESULTS_DIR}/1R_LocalApp_metric_plots.pdf
          echo "; Running plot_QC_metrics: 1 run (LocalApp)"
          uv run plot_QC_metrics.py --joint_QC data/merged_workflow_tables/joint_sequencing_QC_file_1R.tsv  \
                                    --output_pdf ${RESULTS_FILE}                                           \
                                    --metrics_table data/merged_workflow_tables/master_metrics_table_1R.tsv \
                                    --run_id ${RUN_ID}                                                     \
                                    --workflow_type LocalApp                                               ;

      - name: Run plot_QC_metrics.py 1R Dragen
        run: |
          RESULTS_DIR=results_python/${RUN_ID}/1R
          mkdir -p ${RESULTS_DIR}
          RESULTS_FILE=${RESULTS_DIR}/1R_Dragen_metric_plots.pdf
          echo "; Running plot_QC_metrics: 1 run (Dragen)"
          uv run plot_QC_metrics.py --joint_QC data/merged_workflow_tables/joint_sequencing_QC_file_1R.tsv  \
                                    --output_pdf ${RESULTS_FILE}                                           \
                                    --metrics_table data/merged_workflow_tables/master_metrics_table_1R.tsv \
                                    --run_id ${RUN_ID}                                                     \
                                    --workflow_type Dragen                                                 ;

      - name: Run plot_QC_metrics.py 2R LocalApp
        run: |
          RESULTS_DIR=results_python/${RUN_ID}/2R
          mkdir -p ${RESULTS_DIR}
          RESULTS_FILE=${RESULTS_DIR}/2R_LocalApp_metric_plots.pdf
          echo "; Running plot_QC_metrics: 2 runs (LocalApp)"
          uv run plot_QC_metrics.py --joint_QC data/merged_workflow_tables/joint_sequencing_QC_file_2R.tsv  \
                                    --output_pdf ${RESULTS_FILE}                                           \
                                    --metrics_table data/merged_workflow_tables/master_metrics_table_2R.tsv \
                                    --run_id ${RUN_ID}                                                     \
                                    --workflow_type LocalApp                                               ;

      - name: Run plot_QC_metrics.py 2R Dragen
        run: |
          RESULTS_DIR=results_python/${RUN_ID}/2R
          mkdir -p ${RESULTS_DIR}
          RESULTS_FILE=${RESULTS_DIR}/2R_Dragen_metric_plots.pdf
          echo "; Running plot_QC_metrics: 2 runs (Dragen)"
          uv run plot_QC_metrics.py --joint_QC data/merged_workflow_tables/joint_sequencing_QC_file_2R.tsv  \
                                    --output_pdf ${RESULTS_FILE}                                           \
                                    --metrics_table data/merged_workflow_tables/master_metrics_table_2R.tsv \
                                    --run_id ${RUN_ID}                                                     \
                                    --workflow_type Dragen                                                 ;

      - name: Run plot_QC_metrics.py 5R LocalApp
        run: |
          RESULTS_DIR=results_python/${RUN_ID}/5R
          mkdir -p ${RESULTS_DIR}
          RESULTS_FILE=${RESULTS_DIR}/5R_LocalApp_metric_plots.pdf
          echo "; Running plot_QC_metrics: 5 runs (LocalApp)"
