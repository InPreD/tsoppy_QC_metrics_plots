          RESULTS_DIR=results_python/${RUN_ID}/10R
          mkdir -p ${RESULTS_DIR}
          RESULTS_FILE=${RESULTS_DIR}/10R_Dragen_metric_plots.pdf
          echo "; Running plot_QC_metrics: 10 runs (Dragen)"
          uv run plot_QC_metrics.py --joint_QC data/merged_workflow_tables/joint_sequencing_QC_file_10R.tsv  \
                                    --output_pdf ${RESULTS_FILE}                                            \
                                    --metrics_table data/merged_workflow_tables/master_metrics_table_10R.tsv \
                                    --run_id ${RUN_ID}                                                      \
                                    --workflow_type Dragen                                                  ;


      - name: Enable caching
        uses: astral-sh/setup-uv@v6
        with:
            enable-cache: true