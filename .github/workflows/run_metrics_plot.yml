                                    --output_pdf ${RESULTS_FILE}                                           \
                                    --metrics_table data/merged_workflow_tables/master_metrics_table_5R.tsv \
                                    --run_id ${RUN_ID}                                                     \
                                    --workflow_type LocalApp                                               ;

      - name: Run plot_QC_metrics.py 5R Dragen
        run: |
          RESULTS_DIR=results_python/${RUN_ID}/5R
          mkdir -p ${RESULTS_DIR}
          RESULTS_FILE=${RESULTS_DIR}/5R_Dragen_metric_plots.pdf
