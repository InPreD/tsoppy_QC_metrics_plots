name: Run tsoppy QC metrics plots

on:
  push:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run unit tests
        run: uv run pytest tests/ -v


      # =============== #
      # Test with 1 run #
      # =============== #

      - name: Run plot_QC_metrics.py 1R LocalApp
        run: |
          RESULTS_DIR=results_python/1R
          mkdir -p ${RESULTS_DIR}
          RESULTS_FILE=${RESULTS_DIR}/1R_LocalApp_metric_plots.pdf
          echo "; Running plot_QC_metrics: 1 run (LocalApp)"
          uv run plot_QC_metrics.py --joint_QC data/workflow_tables/localapp_plot_joint_sequencing_QC_file.tsv \
                                    --output_pdf ${RESULTS_FILE}                                               \
                                    --metrics_table data/workflow_tables/localapp_plot_metrics_table.tsv       \
                                    --max_runs 1                                                               \
                                    --workflow_type LocalApp                                                   ;

      - name: Run plot_QC_metrics.py 1R Dragen
        run: |
          RESULTS_DIR=results_python/1R
          mkdir -p ${RESULTS_DIR}
          RESULTS_FILE=${RESULTS_DIR}/1R_Dragen_metric_plots.pdf
          echo "; Running plot_QC_metrics: 1 run (Dragen)"
          uv run plot_QC_metrics.py --joint_QC data/workflow_tables/dragen_plot_joint_sequencing_QC_file.tsv \
                                    --output_pdf ${RESULTS_FILE}                                             \
                                    --metrics_table data/workflow_tables/dragen_plot_metrics_table.tsv       \
                                    --max_runs 1                                                             \
                                    --workflow_type Dragen                                                   ;


      # ================ #
      # Test with 2 runs #
      # ================ #

      - name: Run plot_QC_metrics.py 2R LocalApp
        run: |
          RESULTS_DIR=results_python/2R
          mkdir -p ${RESULTS_DIR}
          RESULTS_FILE=${RESULTS_DIR}/2R_LocalApp_metric_plots.pdf
          echo "; Running plot_QC_metrics: 2 runs (LocalApp)"
          uv run plot_QC_metrics.py --joint_QC data/workflow_tables/localapp_plot_joint_sequencing_QC_file.tsv \
                                    --output_pdf ${RESULTS_FILE}                                               \
                                    --metrics_table data/workflow_tables/localapp_plot_metrics_table.tsv       \
                                    --max_runs 2                                                               \
                                    --workflow_type LocalApp                                                   ;

      - name: Run plot_QC_metrics.py 2R Dragen
        run: |
          RESULTS_DIR=results_python/2R
          mkdir -p ${RESULTS_DIR}
          RESULTS_FILE=${RESULTS_DIR}/2R_Dragen_metric_plots.pdf
          echo "; Running plot_QC_metrics: 2 runs (Dragen)"
          uv run plot_QC_metrics.py --joint_QC data/workflow_tables/dragen_plot_joint_sequencing_QC_file.tsv \
                                    --output_pdf ${RESULTS_FILE}                                             \
                                    --metrics_table data/workflow_tables/dragen_plot_metrics_table.tsv       \
                                    --max_runs 2                                                             \
                                    --workflow_type Dragen                                                   ;


      # ================ #
      # Test with 5 runs #
      # ================ #

      - name: Run plot_QC_metrics.py 5R LocalApp
        run: |
          RESULTS_DIR=results_python/5R
          mkdir -p ${RESULTS_DIR}
          RESULTS_FILE=${RESULTS_DIR}/5R_LocalApp_metric_plots.pdf
          echo "; Running plot_QC_metrics: 5 runs (LocalApp)"
          uv run plot_QC_metrics.py --joint_QC data/workflow_tables/localapp_plot_joint_sequencing_QC_file.tsv \
                                    --output_pdf ${RESULTS_FILE}                                               \
                                    --metrics_table data/workflow_tables/localapp_plot_metrics_table.tsv       \
                                    --max_runs 5                                                               \
                                    --workflow_type LocalApp                                                   ;

      - name: Run plot_QC_metrics.py 5R Dragen
        run: |
          RESULTS_DIR=results_python/5R
          mkdir -p ${RESULTS_DIR}
          RESULTS_FILE=${RESULTS_DIR}/5R_Dragen_metric_plots.pdf
          echo "; Running plot_QC_metrics: 5 runs (Dragen)"
          uv run plot_QC_metrics.py --joint_QC data/workflow_tables/dragen_plot_joint_sequencing_QC_file.tsv \
                                    --output_pdf ${RESULTS_FILE}                                             \
                                    --metrics_table data/workflow_tables/dragen_plot_metrics_table.tsv       \
                                    --max_runs 5                                                             \
                                    --workflow_type Dragen                                                   ;


      # ================= #
      # Test with 10 runs #
      # ================= #

      - name: Run plot_QC_metrics.py 10R LocalApp
        run: |
          RESULTS_DIR=results_python/10R
          mkdir -p ${RESULTS_DIR}
          RESULTS_FILE=${RESULTS_DIR}/10R_LocalApp_metric_plots.pdf
          echo "; Running plot_QC_metrics: 10 runs (LocalApp)"
          uv run plot_QC_metrics.py --joint_QC data/workflow_tables/localapp_plot_joint_sequencing_QC_file.tsv \
                                    --output_pdf ${RESULTS_FILE}                                               \
                                    --metrics_table data/workflow_tables/localapp_plot_metrics_table.tsv       \
                                    --max_runs 10                                                              \
                                    --workflow_type LocalApp                                                   ;

      - name: Run plot_QC_metrics.py 10R Dragen
        run: |
          RESULTS_DIR=results_python/10R
          mkdir -p ${RESULTS_DIR}
          RESULTS_FILE=${RESULTS_DIR}/10R_Dragen_metric_plots.pdf
          echo "; Running plot_QC_metrics: 10 runs (Dragen)"
          uv run plot_QC_metrics.py --joint_QC data/workflow_tables/dragen_plot_joint_sequencing_QC_file.tsv \
                                    --output_pdf ${RESULTS_FILE}                                             \
                                    --metrics_table data/workflow_tables/dragen_plot_metrics_table.tsv       \
                                    --max_runs 10                                                            \
                                    --workflow_type Dragen                                                   ;


      # ============================== #
      # Per-sample QC plots (LocalApp) #
      # ============================== #

      - name: Run plot_sample_metrics.py – DNA passing sample [LocalApp TSV]
        run: |
          RESULTS_DIR=results_python/sample_metrics
          mkdir -p ${RESULTS_DIR}
          echo "; Running plot_sample_metrics.py --seq_type DNA (IPD0195-D01-P91-A25-0001_P)"
          uv run plot_sample_metrics.py                                          \
              --input_tsv data/workflow_tables/localapp_plot_metrics_table.tsv   \
              --sample_id IPD0195-D01-P91-A25-0001_P                             \
              --output_pdf ${RESULTS_DIR}/IPD0195-D01-P91-A25-0001_P_DNA_QC.pdf  \
              --seq_type DNA                                                      \
              --workflow L                                                        \
              --inpred_nomenclature False                                        ;


      - name: Run plot_sample_metrics.py – RNA passing sample [LocalApp TSV]
        run: |
          RESULTS_DIR=results_python/sample_metrics
          mkdir -p ${RESULTS_DIR}
          echo "; Running plot_sample_metrics.py --seq_type RNA (IPD0195-R03-P91-A25-0001_P)"
          uv run plot_sample_metrics.py                                          \
              --input_tsv data/workflow_tables/localapp_plot_metrics_table.tsv   \
              --sample_id IPD0195-R03-P91-A25-0001_P                             \
              --output_pdf ${RESULTS_DIR}/IPD0195-R03-P91-A25-0001_P_RNA_QC.pdf  \
              --seq_type RNA                                                      \
              --workflow L                                                        \
              --inpred_nomenclature False  


      # ============================ #
      # Per-sample QC plots (Dragen) #
      # ============================ #

      - name: Run plot_sample_metrics.py – DNA passing sample [Dragen TSV]
        run: |
          RESULTS_DIR=results_python/sample_metrics
          mkdir -p ${RESULTS_DIR}
          echo "; Running plot_sample_metrics.py --seq_type DNA (TVD0018)"
          uv run plot_sample_metrics.py                                      \
              --input_tsv data/workflow_tables/dragen_plot_metrics_table.tsv \
              --sample_id TVD0018                                            \
              --output_pdf ${RESULTS_DIR}/TVD0018_DNA_QC.pdf                 \
              --seq_type DNA                                                 \
              --workflow D                                                   \
              --inpred_nomenclature False                                    ;


      - name: Run plot_sample_metrics.py – RNA passing sample [Dragen TSV]
        run: |
          RESULTS_DIR=results_python/sample_metrics
          mkdir -p ${RESULTS_DIR}
          echo "; Running plot_sample_metrics.py --seq_type RNA (TVR0020)"
          uv run plot_sample_metrics.py                                          \
              --input_tsv data/workflow_tables/dragen_plot_metrics_table.tsv     \
              --sample_id TVR0020                                                 \
              --output_pdf ${RESULTS_DIR}/TVR0020_RNA_QC.pdf                     \
              --seq_type RNA                                                      \
              --workflow D                                                        \
              --inpred_nomenclature False                                        ;


      # ========================================= #
      # Per-sample QC plots                       #
      # (DNA – failing sample, shows red crosses) #
      # ========================================= #

      - name: Run plot_sample_metrics.py – DNA failing sample [LocalApp TSV]
        run: |
          RESULTS_DIR=results_python/sample_metrics
          mkdir -p ${RESULTS_DIR}
          echo "; Running plot_sample_metrics.py --seq_type DNA (IPD1881-D01-D01-A25_P – multiple QC failures)"
          uv run plot_sample_metrics.py                                        \
              --input_tsv data/workflow_tables/localapp_plot_metrics_table.tsv \
              --sample_id IPD1881-D01-D01-A25_P                                \
              --output_pdf ${RESULTS_DIR}/IPD1881-D01-D01-A25_P_DNA_QC.pdf     \
              --seq_type DNA                                                   \
              --workflow L                                                     \
              --inpred_nomenclature False                                      ;


      # ========================================= #
      # Per-sample QC plots                       #
      # (RNA – failing sample, shows red crosses) #
      # ========================================= #

      - name: Run plot_sample_metrics.py – RNA failing sample [LocalApp TSV]
        run: |
          RESULTS_DIR=results_python/sample_metrics
          mkdir -p ${RESULTS_DIR}
          echo "; Running plot_sample_metrics.py --seq_type RNA (IPD1837-R03-P01-A08_P – CV QC failure)"
          uv run plot_sample_metrics.py                                        \
              --input_tsv data/workflow_tables/localapp_plot_metrics_table.tsv \
              --sample_id IPD1837-R03-P01-A08_P                                \
              --output_pdf ${RESULTS_DIR}/IPD1837-R03-P01-A08_P_RNA_QC.pdf     \
              --seq_type RNA                                                   \
              --workflow L                                                     \
              --inpred_nomenclature False                                      ;


      - name: Run plot_sample_metrics.py – RNA out-of-range NoThold metric [LocalApp TSV]
        run: |
          RESULTS_DIR=results_python/sample_metrics
          mkdir -p ${RESULTS_DIR}
          echo "; Running plot_sample_metrics.py --seq_type RNA (IPD0820-R03-P91-F08-0013_P – chimeric reads above bar max)"
          uv run plot_sample_metrics.py                                         \
              --input_tsv data/workflow_tables/localapp_plot_metrics_table.tsv  \
              --sample_id IPD0820-R03-P91-F08-0013_P                            \
              --output_pdf ${RESULTS_DIR}/IPD0820-R03-P91-F08-0013_P_RNA_QC.pdf \
              --seq_type RNA                                                    \
              --workflow L                                                      \
              --inpred_nomenclature False                                       ;


      - name: Enable caching
        uses: astral-sh/setup-uv@v6
        with:
            enable-cache: true